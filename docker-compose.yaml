version: '3'
services: 
  app:
      build: .
      ports: 
          - 8000:8000
      restart: always
      depends_on:
        - db
  db:
      image: mysql:8.0.27
      volumes:
        - ./database/migration:/docker-entrypoint-initdb.d
        - dbdata:/var/lib/mysql/
      environment:
        - MYSQL_ALLOW_EMPTY_PASSWORD=true
      ports:
        - 3306:3306
volumes: 
  dbdata:
    driver: local